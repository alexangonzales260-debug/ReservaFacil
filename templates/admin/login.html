{% extends "base.html" %}
{% block title %}Login Admin · ReservaFácil{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white rounded-lg shadow p-6 mt-8">
  <h1 class="text-xl font-bold text-center mb-1">Panel de Administración</h1>
  <p class="text-sm text-gray-500 text-center mb-4">ReservaFácil · Peluquería</p>
  {% if error %}
  <p class="bg-red-100 text-red-700 border border-red-300 rounded px-3 py-2 mb-3 text-sm">{{ error }}</p>
  {% endif %}
  <form method="post" action="{{ url_for('admin.login_post') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label for="username" class="block text-sm font-medium mb-1">Usuario</label>
      <input name="username" id="username" required value="{{ username or '' }}" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
    </div>
    <div class="mb-4">
      <label for="password" class="block text-sm font-medium mb-1">Contraseña</label>
      <input name="password" id="password" type="password" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
    </div>
    <button class="w-full bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg py-2 font-medium">Ingresar</button>
  </form>
</div>
{% endblock %}
